<html lang="it"><head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=67387&format=png&color=000000">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
</head>

<body>
<div id="navbar">    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-logo">MyApp</div>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/weather">Weather</a></li>
            <li><a href="/login">Login</a></li>
            <li><a href="/signin">Sign In</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav></div>
    <script>
        fetch("components/navbar.html") //scarica il file da componenets
            .then(res => res.text()) //quando fetch finisce genera il response e prendi il contenuto come stringa
            .then(html => document.getElementById("navbar").innerHTML = html); //inserisci in navbar stringa dentro al div 
    </script>
<div class="login-wrapper">
    <div class="login-box">
        <h2>Login</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required="">
            <input type="password" name="password" placeholder="Password" required="">
            <button type="submit">Accedi</button>
        </form>
    </div>
</div>
    <!-- FOOTER -->
    <div id="footer"><footer class="footer">
    <p>© 2026 MyApp – Tutti i diritti riservati</p>
</footer></div>

    <script>
        fetch("components/footer.html")
            .then(res => res.text())
            .then(html => document.getElementById("footer").innerHTML = html);
    </script>


</body></html>
